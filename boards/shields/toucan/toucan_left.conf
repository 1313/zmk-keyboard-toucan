CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Full N-key rollover so chorded combos and gaming work without ghosting.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Per-device runtime power management lets buses (SPI, etc.) suspend
# between transfers instead of only on full system suspend.
# PM_DEVICE_SYSTEM_MANAGED is also kept enabled (Zephyr defaults it off
# when RUNTIME is enabled) so ZMK's deep-sleep path still has the
# zmk_pm_suspend_devices() function it expects from activity.c / pm.c.
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# Drop the Zephyr boot banner and PnP HID descriptor; neither is useful
# in production firmware.
CONFIG_BOOT_BANNER=n
CONFIG_BT_DIS_PNP=n

# Deep sleep disabled on central due to ZMK main bug:
# https://github.com/zmkfirmware/zmk/issues/3207
# (central fails to wake from deep sleep, drains battery; not present in v0.3)
# Re-enable once that issue is fixed.
# CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_SLEEP=n

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconnect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we 
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# We need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the trackpad driver.
# SOFT_OFF implies all of these and also adds an optional SOFT_OFF feature.
CONFIG_ZMK_PM_SOFT_OFF=y

# Faster BLE connection interval to the host for lower keypress latency.
# 6 = 7.5ms (the minimum BLE allows). Latency=0 means the host can never
# defer connection events, so reports go out on the very next event window.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
