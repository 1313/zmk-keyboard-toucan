# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: xiao_ble//zmk
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: nrf52840-nosd
  - board: xiao_ble//zmk
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: nrf52840-nosd studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: toucan_left_studio
  - board: xiao_ble//zmk
    shield: toucan_right rgbled_adapter
    snippet: nrf52840-nosd
  - board: xiao_ble//zmk
    shield: toucan_right rgbled_adapter
    snippet: nrf52840-nosd zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_EVENT_DUMP=y
    artifact-name: toucan_right_debug
  - board: xiao_ble//zmk
    shield: settings_reset
    snippet: nrf52840-nosd
  # Experimental: SoftDevice Controller (SDC) variants. Vendored from
  # nrfconnect/sdk-nrf into modules/sdc/. Untested on hardware; first goal
  # is just getting them to link cleanly in CI.
  - board: xiao_ble//zmk
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: toucan-sdc
    cmake-args: -DCONFIG_TOUCAN_SDC_ATTEMPT=y -DCONFIG_BT_LL_SOFTDEVICE=y -DCONFIG_BT_LL_SOFTDEVICE_BUILD_TYPE_LIB=y
    artifact-name: toucan_left_sd
  - board: xiao_ble//zmk
    shield: toucan_right rgbled_adapter
    snippet: toucan-sdc
    cmake-args: -DCONFIG_TOUCAN_SDC_ATTEMPT=y -DCONFIG_BT_LL_SOFTDEVICE=y -DCONFIG_BT_LL_SOFTDEVICE_BUILD_TYPE_LIB=y
    artifact-name: toucan_right_sd
